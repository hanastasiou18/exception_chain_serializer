[project]
name = "exception-chain-serializer"
version = "0.1.0"
description = "Turns a Python exception and its cause chain into a list of type, message, and traceback tuples."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
